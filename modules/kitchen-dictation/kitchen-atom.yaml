# M5Stack Atom Echo in the kitchen: hold the button and speak, the
# kitchen-dictation bridge on traube adds what it hears to the shopping list.
# The bridge calls the `ring` action when a kitchen timer runs out.
#
# Secrets live outside the repo in ~/.local/share/kitchen-atom/secrets.yaml
# (wifi_ssid, wifi_password, ota_password, api_key), next to a symlink to
# this file. To recreate it: Wi-Fi from NetworkManager (virus.exe),
#   ota_password: clan vars get traube kitchen-atom/ota-password
#   api_key: clan vars get traube kitchen-dictation/api-key
# Flash from that directory; the ESP-IDF toolchain needs an FHS env on NixOS:
#   NIXPKGS_ALLOW_UNFREE=1 nix shell --impure nixpkgs#steam-run -c \
#     steam-run esphome run kitchen-atom.yaml --device 192.168.101.130
#
# Pins from ESPHome's m5stack-atom-echo.yaml in wake-word-voice-assistants.

esphome:
  name: kitchen-atom
  friendly_name: Kitchen dictation

esp32:
  board: m5stack-atom
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key
  actions:
    - action: ring
      then:
        - light.turn_on:
            id: led
            red: 100%
            green: 60%
            blue: 0%
        - rtttl.play: "timer:d=16,o=6,b=160:a,p,a,p,a,p,a,4p,a,p,a,p,a,p,a,4p,a,p,a,p,a,p,a,4p,a,p,a,p,a,p,a"

ota:
  - platform: esphome
    password: !secret ota_password

i2s_audio:
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: mic
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    correct_dc_offset: true

# NS4168 amplifier on the shared I2S bus. Mono playback sounds bad on the
# Echo, hence stereo.
speaker:
  - platform: i2s_audio
    id: spk
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: stereo
    buffer_duration: 60ms

rtttl:
  speaker: spk
  gain: 100%
  on_finished_playback:
    - light.turn_off: led

# The LED says what happened: blue while listening, green when the text
# reached opencrow, red on an error, yellow while a timer rings.
light:
  - platform: esp32_rmt_led_strip
    id: led
    pin: GPIO27
    chipset: SK6812
    num_leds: 1
    rgb_order: grb
    default_transition_length: 0s

voice_assistant:
  microphone:
    microphone: mic
    channels: 0
    # The bridge applies no gain of its own, unlike Home Assistant.
    gain_factor: 4
  on_listening:
    - light.turn_on:
        id: led
        red: 0%
        green: 0%
        blue: 100%
  on_stt_end:
    - light.turn_on:
        id: led
        red: 0%
        green: 100%
        blue: 0%
    - delay: 1s
    - light.turn_off: led
  on_error:
    - light.turn_on:
        id: led
        red: 100%
        green: 0%
        blue: 0%
    - delay: 1s
    - light.turn_off: led

binary_sensor:
  - platform: gpio
    id: talk
    internal: true
    pin:
      number: GPIO39
      inverted: true
    on_press:
      - voice_assistant.start:
          silence_detection: false
    on_release:
      - voice_assistant.stop:
